<svg width="800" height="100" viewBox="0 0 800 100" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="grad1">
      <stop offset="0%" stop-color="#00F7FF">
        <animate attributeName="offset" values="0;1;0" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#007CF0">
        <animate attributeName="offset" values="1;0;1" dur="3s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>

  <text x="50%" y="60%" dominant-baseline="middle" text-anchor="middle"
        font-size="52" font-family="Inter, sans-serif"
        fill="url(#grad1)" font-weight="bold">
    Aditya Yadav
  </text>

</svg>
